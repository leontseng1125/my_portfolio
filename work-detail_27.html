<script>
(function () {
  var bar = document.getElementById('reading-progress-bar');
  if (!bar) return;
  var ticking = false;
  function updateBar() {
    var scrollableHeight = document.documentElement.scrollHeight - window.innerHeight;
    var scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
    var progress = scrollableHeight > 0 ? (scrollTop / scrollableHeight) * 100 : 0;
    progress = Math.min(100, Math.max(0, progress));
    bar.style.width = progress + '%';
    ticking = false;
  }
  function onScroll() { if (!ticking) { requestAnimationFrame(updateBar); ticking = true; } }
  updateBar();
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', updateBar);
  window.addEventListener('load', updateBar);
})();
</script>

<script>
  const navbar = document.getElementById('navbar');
  const menuBtn = document.getElementById('menuBtn');
  const mobileMenu = document.getElementById('mobileMenu');
  let menuOpen = false;
  function closeMobileMenu(instant) {
    menuOpen = false;
    if (instant) {
      mobileMenu.style.transition = 'none';
      mobileMenu.style.maxHeight = '0px';
      mobileMenu.style.opacity = '0';
      void mobileMenu.offsetHeight;
      mobileMenu.style.transition = '';
    } else {
      mobileMenu.style.maxHeight = '0px';
      mobileMenu.style.opacity = '0';
    }
    navbar.classList.remove('menu-open');
  }
  menuBtn.addEventListener('click', () => {
    menuOpen = !menuOpen;
    if (menuOpen) {
      mobileMenu.style.maxHeight = mobileMenu.scrollHeight + 'px';
      mobileMenu.style.opacity = '1';
      navbar.classList.add('menu-open');
    } else {
      closeMobileMenu();
    }
  });
  document.querySelectorAll('#mobileMenu a').forEach(a => {
    a.addEventListener('click', () => closeMobileMenu());
  });

  // Navbar auto-hide on scroll / show on scroll-stop
  (function () {
    const TOP_THRESHOLD = 50;
    const STOP_DELAY = 300;
    let stopTimer = null;
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      if (y < TOP_THRESHOLD) {
        clearTimeout(stopTimer);
        navbar.classList.remove('navbar-hidden');
        return;
      }
      navbar.classList.add('navbar-hidden');
      if (menuOpen) closeMobileMenu(true);
      clearTimeout(stopTimer);
      stopTimer = setTimeout(() => {
        navbar.classList.remove('navbar-hidden');
      }, STOP_DELAY);
    }, { passive: true });
  })();

  // ============ 滾動視差 & 進場顯現 ============
  (function () {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;

    const revealSelectors = '.case-thumb, .img-block';
    document.querySelectorAll(revealSelectors).forEach(el => el.classList.add('reveal'));
    document.querySelectorAll('.case-thumb.contain-img, .img-block').forEach(el => {
      el.classList.remove('reveal');
      el.classList.add('reveal-scale');
    });

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('.reveal, .reveal-scale').forEach(el => revealObserver.observe(el));

    const parallaxEls = document.querySelectorAll('[data-parallax]');
    if (parallaxEls.length) {
      let ticking = false;
      const clamp = (v, max) => Math.max(-max, Math.min(max, v));
      const updateScrollFx = () => {
        const vh = window.innerHeight;
        parallaxEls.forEach(el => {
          const rect = el.getBoundingClientRect();
          const factor = parseFloat(el.dataset.parallax) || 0.15;
          const max = parseFloat(el.dataset.parallaxMax) || 400;
          const offset = clamp((rect.top + rect.height / 2 - vh / 2) * factor, max);
          el.style.transform = `translate3d(0, ${offset}px, 0)`;
        });
        ticking = false;
      };
      window.addEventListener('scroll', () => {
        if (!ticking) {
          requestAnimationFrame(updateScrollFx);
          ticking = true;
        }
      }, { passive: true });
      updateScrollFx();
    }
  })();
</script>
